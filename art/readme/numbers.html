<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>README: the game in numbers</title>
    <link rel="stylesheet" href="../concepts-ydd/fonts.css" />
    <link rel="stylesheet" href="readme.css" />
    <style>
      /* the game in a row of numbers */
      .tiles { display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px; margin-top: 36px; }
      .tile { padding: 16px 12px 18px; text-align: center; }
      .tile b { display: block; font-size: 58px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
      .tile.m b { color: var(--money); }
      .tile.c b { color: var(--coral); }
      .tile span { display: block; margin-top: 4px; font: 400 17px/1.3 'JetBrains Mono', monospace; color: var(--dim); }
      /* four endings: each one is a post of the founder */
      .ends { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 40px; }
      .end { padding: 22px 24px 24px; background: var(--dark); color: var(--paper); border-radius: 14px; }
      .end .kicker { color: var(--dim); font-size: 17px; }
      .end h3 { margin: 6px 0 12px; font-size: 34px; font-weight: 600; line-height: 1.1; }
      .end.good h3 { color: var(--money-dark); }
      .end.bad h3 { color: var(--coral); }
      .end p { margin: 0; font: 400 18px/1.45 'JetBrains Mono', monospace; color: #c9c5b8; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="kicker" data-en="The game in numbers" data-ru="Игра в цифрах"></div>
      <h1 data-en="Sixteen minutes from an idea to a thread about it." data-ru="Шестнадцать минут от идеи до треда о ней."></h1>

      <div class="tiles">
        <div class="tile cardbox"><b>1</b><span data-en="human<br>on the team" data-ru="человек<br>в команде"></span></div>
        <div class="tile cardbox"><b>384</b><span data-en="startups<br>in three words" data-ru="стартапа<br>в трёх словах"></span></div>
        <div class="tile cardbox"><b>20</b><span data-en="product<br>blocks" data-ru="блоков<br>продукта"></span></div>
        <div class="tile cardbox c"><b>30</b><span data-en="tech debt<br>before it falls" data-ru="техдолга<br>до падения"></span></div>
        <div class="tile cardbox"><b>11</b><span data-en="dilemmas<br>with a price" data-ru="дилемм<br>с ценой"></span></div>
        <div class="tile cardbox"><b>40</b><span data-en="industry<br>headlines" data-ru="заголовков<br>об отрасли"></span></div>
        <div class="tile cardbox m"><b>214</b><span data-en="questions in the<br>vendor questionnaire" data-ru="вопросов в анкете<br>поставщика"></span></div>
      </div>

      <div class="ends">
        <div class="end bad">
          <div class="kicker" data-en="ending 1 of 4" data-ru="концовка 1 из 4"></div>
          <h3 data-en="Bankruptcy" data-ru="Банкротство"></h3>
          <p data-en="“Shutting down my startup. Ten lessons. Thread.”" data-ru="«Закрываю стартап. Десять уроков. Тред.»"></p>
        </div>
        <div class="end">
          <div class="kicker" data-en="ending 2 of 4" data-ru="концовка 2 из 4"></div>
          <h3 data-en="Out of time" data-ru="Время вышло"></h3>
          <p data-en="“We are not losing money, we are ‘investing in growth’. Out of my savings.”" data-ru="«Мы не убыточны, мы „инвестируем в рост“. Из моих сбережений.»"></p>
        </div>
        <div class="end good">
          <div class="kicker" data-en="ending 3 of 4" data-ru="концовка 3 из 4"></div>
          <h3 data-en="Exit" data-ru="Продажа"></h3>
          <p data-en="“The product will be ‘integrated into the ecosystem’. It means what you think it means.”" data-ru="«Продукт „интегрируют в экосистему“. Это значит то, что вы подумали.»"></p>
        </div>
        <div class="end good">
          <div class="kicker" data-en="ending 4 of 4" data-ru="концовка 4 из 4"></div>
          <h3 data-en="Profit" data-ru="Прибыль"></h3>
          <p data-en="“We are profitable. Yes, that is allowed too. Thread.”" data-ru="«Мы прибыльны. Да, так тоже можно. Тред.»"></p>
        </div>
      </div>
    </div>
    <script src="readme.js"></script>
  </body>
</html>
