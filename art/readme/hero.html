<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>README: hero</title>
    <link rel="stylesheet" href="../concepts-ydd/fonts.css" />
    <link rel="stylesheet" href="readme.css" />
    <style>
      body { position: relative; height: 640px; overflow: hidden; background: var(--dark); color: var(--paper); font-family: 'JetBrains Mono', monospace; }
      .bar { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 34px; border-bottom: 1.5px solid var(--frame); font-size: 20px; color: var(--dim); }
      .face { position: relative; width: 30px; height: 22px; background: var(--coral); }
      .face::before, .face::after { content: ''; position: absolute; top: 6px; width: 4px; height: 8px; background: var(--dark); }
      .face::before { left: 8px; }
      .face::after { right: 8px; }
      .bar .r { margin-left: auto; }
      .left { position: absolute; left: 64px; top: 112px; width: 640px; }
      .left h1 { margin: 0; font: 600 124px/1 'Source Serif 4', serif; color: var(--paper); letter-spacing: -0.02em; }
      .left p { margin: 26px 0 0; font-size: 25px; line-height: 1.5; color: #c9c5b8; }
      .left p b { color: var(--paper); font-weight: 700; }
      .money { margin-top: 30px; padding-top: 22px; border-top: 1.5px solid var(--frame); font: 600 54px/1 'Source Serif 4', serif; color: var(--money-dark); letter-spacing: -0.01em; }
      .burn { margin-top: 12px; font-size: 21px; color: var(--dim); }
      .burn b { color: var(--coral); font-weight: 700; }
      .burn i { font-style: normal; color: var(--paper); font-weight: 700; }
      /* the three cards of the idea, dealt face up */
      .cards { position: absolute; right: 56px; top: 92px; display: flex; align-items: flex-start; gap: 22px; }
      .card { width: 262px; padding-bottom: 18px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 16px; overflow: hidden; }
      .card:nth-child(1) { transform: rotate(-2.2deg) translateY(10px); }
      .card:nth-child(2) { transform: translateY(-8px); outline: 4px solid var(--coral); }
      .card:nth-child(3) { transform: rotate(2.2deg) translateY(12px); }
      .card .art { height: 150px; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1.5px solid var(--ink); background-image: radial-gradient(var(--line) 1.2px, transparent 1.3px); background-size: 22px 22px; }
      .card .art img { max-height: 134px; max-width: 200px; margin-bottom: 6px; }
      .card small { display: block; margin: 14px 20px 0; font: 400 13px/1 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
      .card b { display: block; margin: 6px 20px 0; font: 600 29px/1.12 'Source Serif 4', serif; }
      .card p { margin: 8px 20px 0; font: 400 17px/1.3 'Source Serif 4', serif; color: var(--dim); }
      .card li { font: 400 14.5px/1.5 'JetBrains Mono', monospace; }
      .card ul { margin: 10px 20px 0; padding: 0; list-style: none; }
      .card li::before { content: '■'; margin-right: 8px; font-size: 9px; vertical-align: 2px; color: var(--coral); }
      .pitch { position: absolute; right: 56px; bottom: 36px; width: 830px; font: 600 33px/1.2 'Source Serif 4', serif; color: var(--paper); text-align: center; }
      .pitch span { color: var(--dim); font: 400 20px 'JetBrains Mono', monospace; display: block; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="face"></span>
      <span data-en="the founder’s terminal" data-ru="терминал основателя"></span>
      <span class="r">b2b-saas</span>
    </div>

    <div class="left">
      <h1>B2B SaaS</h1>
      <p
        data-en="Build an AI startup with your own hands.<br>The team is <b>Claude</b>. The money is <b>yours</b>."
        data-ru="Собери стартап на ИИ своими руками.<br>Команда — <b>Клод</b>. Деньги — <b>твои</b>."
      ></p>
      <div class="money" data-en="$3,578" data-ru="$3 578"></div>
      <div class="burn" data-en="<b>−$10</b> per second · money for <i>5:57</i>" data-ru="<b>−$10</b> в секунду · денег на <i>5:57</i>"></div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="art"><img src="../../public/assets/img/nodes/desk_empty.webp" /></div>
        <small data-en="what kind of AI" data-ru="какой ИИ"></small>
        <b data-en="Voice AI" data-ru="Голосовой ИИ"></b>
        <p data-en="calls the clients so you don’t have to" data-ru="звонит клиентам вместо тебя"></p>
        <ul>
          <li data-en="building costs ×1.25" data-ru="строить дороже ×1,25"></li>
        </ul>
      </div>
      <div class="card">
        <div class="art"><img src="../../public/assets/img/nodes/handshake.webp" /></div>
        <small data-en="what it is like" data-ru="на что похоже"></small>
        <b data-en="AI Tinder" data-ru="ИИ-тиндер"></b>
        <p data-en="swipe right — and the meeting is in the calendar" data-ru="свайп вправо — и встреча в календаре"></p>
        <ul>
          <li data-en="word of mouth ×2.2" data-ru="сарафан ×2,2"></li>
        </ul>
      </div>
      <div class="card">
        <div class="art"><img src="../../public/assets/img/nodes/clinic.webp" /></div>
        <small data-en="who we sell to" data-ru="кому продаём"></small>
        <b data-en="for dental clinics" data-ru="для стоматологий"></b>
        <p data-en="pay well, book by phone" data-ru="платят хорошо, записываются по телефону"></p>
        <ul>
          <li data-en="pays from $4.7/s" data-ru="платит от $4,7/с"></li>
        </ul>
      </div>
    </div>
    <div class="pitch">
      <span data-en="❯ describe the startup in three words" data-ru="❯ опишите стартап в трёх словах"></span>
      <div data-en="“Voice AI Tinder for dental clinics”" data-ru="«Голосовой ИИ-тиндер для стоматологий»"></div>
    </div>
    <script src="readme.js"></script>
  </body>
</html>
